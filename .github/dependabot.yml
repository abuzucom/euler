---
# Weekly update PRs for SHA-pinned actions and the lint tool pins. Dependabot
# opens PRs only. A human reviews and merges each one (AGENTS.md Rule 9).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      lint-tools:
        patterns:
          - "*"
