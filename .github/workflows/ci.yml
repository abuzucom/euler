name: ci

# Runs the repository checks from the Makefile on every pull request.
# Every step uses the Python standard library. The only third-party actions
# are SHA-pinned checkout and setup-python.

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The policy diff report reads QUALITY.md at the base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # tomllib in the dependency checkers requires Python 3.11 or later.
          python-version: '3.12'

      - name: Repository checks
        run: make check

      - name: QUALITY.md diff report
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_policy="$RUNNER_TEMP/base-quality.md"
          head_policy="$RUNNER_TEMP/head-quality.md"
          if git cat-file -e "$BASE_SHA:QUALITY.md" 2>/dev/null; then
            git show "$BASE_SHA:QUALITY.md" > "$base_policy"
          else
            : > "$base_policy"
          fi
          git show "$HEAD_SHA:QUALITY.md" > "$head_policy"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          python3 scripts/quality_diff_report.py "$base_policy" "$head_policy" \
            --changed-files "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_STEP_SUMMARY"
