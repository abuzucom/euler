---
name: ci

# Runs the repository checks from the Makefile on every pull request. The
# checks job uses the Python standard library on every supported Python. The
# lint job installs the hash-pinned tools from requirements-dev.txt.

"on":
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # tomllib in the dependency checkers requires Python 3.11 or later.
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          # The policy diff report reads QUALITY.md at the base commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Repository checks
        run: make check

      - name: QUALITY.md diff report
        # One report per pull request. The report does not depend on the Python version.
        if: matrix.python-version == '3.12'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_policy="$RUNNER_TEMP/base-quality.md"
          head_policy="$RUNNER_TEMP/head-quality.md"
          if git cat-file -e "$BASE_SHA:QUALITY.md" 2>/dev/null; then
            git show "$BASE_SHA:QUALITY.md" > "$base_policy"
          else
            : > "$base_policy"
          fi
          git show "$HEAD_SHA:QUALITY.md" > "$head_policy"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          python3 scripts/quality_diff_report.py "$base_policy" "$head_policy" \
            --changed-files "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_STEP_SUMMARY"

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Install lint tools
        run: python3 -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: make lint
