name: ci

# Runs the repository checks from the Makefile on every pull request.
# Every step uses the Python standard library. The only third-party actions
# are SHA-pinned checkout and setup-python.

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          # tomllib in the dependency checkers requires Python 3.11 or later.
          python-version: '3.12'

      - name: Repository checks
        run: make check
