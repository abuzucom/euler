---
name: immutable-conflict-check

# Runs the pinned abuzucom/foucault compliance checker against every pull
# request tree before the PR security review may run. The checker modules
# and the hash-pinned dependency file come from the same commit as the
# review pin. The workflow definition itself matches the exact trusted
# schema that check_compliance_tree.py validates in every pull request
# tree, so a pull request cannot weaken this runner.
#
# Upgrade: port the change from the new upstream immutable-conflict-check.yml
# while keeping the step list and trusted environment bindings intact.
"on":
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited, converted_to_draft, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
  PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
  PR_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
  PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  PR_REPO: pr-head
  TRUSTED_CHECKER: trusted-base/scripts/check_compliance_tree.py
  GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ github.workspace }}/trusted-base/.git/objects

jobs:
  immutable-compliance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.PR_BASE_REPOSITORY }}
          ref: ${{ env.PR_BASE_SHA }}
          path: trusted-base
          persist-credentials: false
          fetch-depth: 201
      - name: Check out the exact pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.PR_HEAD_REPOSITORY }}
          ref: ${{ env.PR_HEAD_SHA }}
          path: pr-head
          persist-credentials: false
          fetch-depth: 201
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'
      - name: Install trusted checker dependencies
        run: >-
          python -m pip install --require-hashes
          --requirement trusted-base/requirements-checkers.txt
      - name: Scan immutable pull request objects with the trusted checker
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python "$TRUSTED_CHECKER"
          --repo "$PR_REPO" --tree "$PR_HEAD_SHA"
          --base "$PR_BASE_SHA" --branch "$PR_HEAD_BRANCH"
          --pr-author "$PR_AUTHOR"
