            let conclusion;
            let output;
            if (result && typeof result.verdict === 'string') {
              const blocking = ['BLOCK', 'NEEDS-HUMAN'].includes(result.verdict);
              conclusion = blocking ? blockingConclusion : 'success';
              output = {
                title: `Euler quality review: ${result.verdict}`,
                summary: `Verdict ${result.verdict}.`,
                text: reportText || undefined,
              };
            } else {
              conclusion = blockingConclusion;
              output = {
                title: 'Euler quality review: no verdict',
                summary: `The review ended before a verdict. Workflow run: ${process.env.RUN_URL}`,
                text: reportText || undefined,
