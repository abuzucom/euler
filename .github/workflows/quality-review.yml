---
name: quality-review

# Reusable PR quality review. Adopters call it with every reference pinned to
# a full commit SHA:
#
#   uses: abuzucom/euler/.github/workflows/quality-review.yml@<full-commit-sha>
#   with:
#     quality_ref: "<the same full-commit-sha>"
#
# The same-repository job checks out the base revision and reads the head
# revision from git objects. The protected fork job fetches the pull request
# ref after environment approval. Neither job executes pull request content.
# Pull request text reaches scripts through environment variables only.

"on":
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number."
        required: true
        type: number
      base_sha:
        description: "Full base commit SHA."
        required: true
        type: string
      head_sha:
        description: "Full head commit SHA."
        required: true
        type: string
      pr_title:
        description: "Pull request title. Review data only."
        required: false
        type: string
        default: ""
      pr_body:
        description: "Pull request body. Review data only."
        required: false
        type: string
        default: ""
      quality_ref:
        description: "abuzucom/euler commit SHA for QUALITY.md and the ci/ adapter. Match the uses: pin."
        required: true
        type: string
      fail_on_block:
        description: "Fail the check on BLOCK or NEEDS-HUMAN."
        required: false
        type: boolean
        default: true
      fork_review:
        description: "Run the review in the protected fork-review environment."
        required: false
        type: boolean
        default: false
      exclude_paths:
        description: "Whitespace-separated globs skipped by the deterministic prescan."
        required: false
        type: string
        default: ""
    secrets:
      MODEL_API_KEY:
        required: false

permissions:
  contents: read

jobs:
  review:
    if: ${{ inputs.fork_review != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: quality-review-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.base_sha }}
          # Full history keeps the base revision and ancestor commits available.
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout euler policy and adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: abuzucom/euler
          ref: ${{ inputs.quality_ref }}
          path: .euler
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Build review envelopes
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: >-
          python3 .euler/ci/build_pr_case.py
          --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
          --pr-number "$PR_NUMBER" --exclude "$EXCLUDE_PATHS"
          --out-dir "$RUNNER_TEMP/review"

      - name: Validate model API key
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [[ -z "$MODEL_API_KEY" ]]; then
            echo "::error::MODEL_API_KEY must be configured."
            exit 1
          fi

      - name: Run model review
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: >-
          python3 .euler/ci/run_review.py review
          --review-dir "$RUNNER_TEMP/review" --policy .euler/QUALITY.md

      - name: Post review comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/review/report.md`;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- euler-quality-review -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Publish quality-review check run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          FAIL_ON_BLOCK: ${{ inputs.fail_on_block }}
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/review/result.json`, 'utf8'));
            const blocking = ['BLOCK', 'NEEDS-HUMAN'].includes(result.verdict);
            const conclusion = blocking ? (process.env.FAIL_ON_BLOCK === 'true' ? 'failure' : 'neutral') : 'success';
            await github.rest.checks.create({
              ...context.repo,
              name: 'quality-review',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              output: { title: `Euler quality review: ${result.verdict}`, summary: `Verdict ${result.verdict}.` },
            });

      - name: Gate on verdict
        env:
          FAIL_ON_BLOCK: ${{ inputs.fail_on_block }}
        run: python3 .euler/ci/run_review.py gate "$RUNNER_TEMP/review/result.json" --fail-on-block "$FAIL_ON_BLOCK"

  fork-review:
    if: ${{ inputs.fork_review == true }}
    runs-on: ubuntu-latest
    environment: fork-review
    permissions:
      contents: read
      pull-requests: write
      checks: write
    concurrency:
      group: quality-review-${{ github.repository }}-${{ inputs.pr_number }}
      cancel-in-progress: true
    steps:
      - name: Checkout base revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: ${{ inputs.base_sha }}
          # Full history keeps the base revision and ancestor commits available.
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch fork pull request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: refs/pull/${{ inputs.pr_number }}/head
          fetch-depth: 0
          persist-credentials: false
          # The protected job reads PR files as data and never executes them.
          allow-unsafe-pr-checkout: true

      - name: Checkout euler policy and adapter
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: abuzucom/euler
          ref: ${{ inputs.quality_ref }}
          path: .euler
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Build review envelopes
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_TITLE: ${{ inputs.pr_title }}
          PR_BODY: ${{ inputs.pr_body }}
          EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        run: >-
          python3 .euler/ci/build_pr_case.py
          --repo . --base "$BASE_SHA" --head "$HEAD_SHA"
          --pr-number "$PR_NUMBER" --exclude "$EXCLUDE_PATHS"
          --out-dir "$RUNNER_TEMP/review"

      - name: Validate model API key
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          if [[ -z "$MODEL_API_KEY" ]]; then
            echo "::error::MODEL_API_KEY must be configured."
            exit 1
          fi

      - name: Run model review
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: >-
          python3 .euler/ci/run_review.py review
          --review-dir "$RUNNER_TEMP/review" --policy .euler/QUALITY.md

      - name: Post review comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          PR_NUMBER: ${{ inputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const path = `${process.env.RUNNER_TEMP}/review/report.md`;
            const body = fs.readFileSync(path, 'utf8');
            const marker = '<!-- euler-quality-review -->';
            const issue_number = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body && comment.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Publish quality-review check run
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7.1.0
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          FAIL_ON_BLOCK: ${{ inputs.fail_on_block }}
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/review/result.json`, 'utf8'));
            const blocking = ['BLOCK', 'NEEDS-HUMAN'].includes(result.verdict);
            const conclusion = blocking ? (process.env.FAIL_ON_BLOCK === 'true' ? 'failure' : 'neutral') : 'success';
            await github.rest.checks.create({
              ...context.repo,
              name: 'quality-review',
              head_sha: process.env.HEAD_SHA,
              status: 'completed',
              conclusion,
              output: { title: `Euler quality review: ${result.verdict}`, summary: `Verdict ${result.verdict}.` },
            });

      - name: Gate on verdict
        env:
          FAIL_ON_BLOCK: ${{ inputs.fail_on_block }}
        run: python3 .euler/ci/run_review.py gate "$RUNNER_TEMP/review/result.json" --fail-on-block "$FAIL_ON_BLOCK"
