---
name: scheduled-validation

# Weekly make check between pull requests. It catches breakage from new runner
# images or Python releases. This workflow stays separate from ci because a
# scheduled ci run would fire the workflow_run review callers without a pull
# request to review.

"on":
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Repository checks
        run: make check
