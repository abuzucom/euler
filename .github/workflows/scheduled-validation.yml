---
name: scheduled-validation

# Weekly make check between pull requests. It catches breakage from new runner
# images or Python releases. This workflow stays separate from ci because a
# scheduled ci run would fire the workflow_run review callers without a pull
# request to review.

"on":
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'

      - name: Repository checks
        run: make check
