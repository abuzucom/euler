---
name: security-review-pr

# Runs the abuzucom/foucault PR security review on this repository's pull
# requests. The reusable security-review.yml carries the pinned review
# implementation with .foucault/ script paths. The caller resolves one pull
# request, gates both execution paths, and maps the provider secret.
#
# workflow_run keeps this workflow on default-branch code. A pull request
# cannot edit the reviewer. A same-repository pull request runs the review
# job. A fork pull request needs the safe-to-review label and manual
# approval in the fork-review environment.
#
# Upgrade: set FOUCAULT_REF to a new full commit SHA, update the version
# comment, and diff the reusable file against the new upstream workflow.

"on":
  workflow_run:
    workflows: [immutable-conflict-check]
    types: [completed]

# A newer run for the same head cancels an obsolete paid review about to
# start. The verdict-record dedupe skips a head that already carries a
# trusted review record, so a cancelled run loses at most the setup time.
concurrency:
  group: security-review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

# Each job declares only the permissions it uses. Upstream foucault grants
# these permissions at workflow level.
permissions:
  contents: read

env:
  # Foucault v3.7.12.
  FOUCAULT_REF: "770ecbb4c52e50c554214c68245e16832a70e0be"

jobs:
  resolve-pr:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      same_repository: ${{ steps.resolve.outputs.same_repository }}
      already_reviewed: ${{ steps.resolve.outputs.already_reviewed }}
      fork_review_approved: ${{ steps.resolve.outputs.fork_review_approved }}
      compliance_passed: ${{ steps.resolve.outputs.compliance_passed }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      base_sha: ${{ steps.resolve.outputs.base_sha }}
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      head_repo_url: ${{ steps.resolve.outputs.head_repo_url }}
      head_repo_full_name: ${{ steps.resolve.outputs.head_repo_full_name }}
      audit_ref: ${{ steps.audit-ref.outputs.audit_ref }}
    steps:
      # A reusable-workflow call cannot read the env context in its with:
      # inputs. This step republishes the pin as a job output for both callers.
      - name: Publish the pinned audit ref
        id: audit-ref
        run: echo "audit_ref=$FOUCAULT_REF" >> "$GITHUB_OUTPUT"

      - name: Resolve pull request from workflow run head
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const workflowRun = context.payload.workflow_run;
            const headSha = workflowRun?.head_sha;
            if (!/^[0-9a-f]{40}$/.test(headSha || "")) {
              core.setFailed("workflow run head SHA is invalid");
              return;
            }

            const pullRequests = await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: headSha,
                per_page: 100,
              },
            );
            const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
            const candidates = pullRequests.filter((pullRequest) =>
              pullRequest.base?.repo?.full_name?.toLowerCase() ===
              baseRepository.toLowerCase() &&
              pullRequest.head?.sha?.toLowerCase() === headSha.toLowerCase()
            );
            if (candidates.length !== 1) {
              core.setFailed(
                `expected one pull request for workflow run head, found ${candidates.length}`,
              );
              return;
            }

            let pullRequest = candidates[0];
            const candidateHeadRepository = pullRequest.head?.repo;
            if (!candidateHeadRepository?.full_name) {
              core.setFailed("pull request head repository metadata is unavailable");
              return;
            }
            const sameRepository =
              candidateHeadRepository.full_name.toLowerCase() ===
              baseRepository.toLowerCase();
            if (!sameRepository) {
              const currentPullRequest = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pullRequest.number,
              });
              pullRequest = currentPullRequest.data;
            }
            const headRepository = pullRequest.head?.repo;
            if (!headRepository?.full_name || !headRepository.clone_url) {
              core.setFailed("pull request head repository metadata is unavailable");
              return;
            }
            if (
              pullRequest.base?.repo?.full_name?.toLowerCase() !==
              baseRepository.toLowerCase() ||
              pullRequest.head?.sha?.toLowerCase() !== headSha.toLowerCase()
            ) {
              core.setFailed("pull request changed while resolving review metadata");
              return;
            }
            const compliancePassed = workflowRun?.name === "immutable-conflict-check" &&
              workflowRun?.head_sha?.toLowerCase() === headSha.toLowerCase() &&
              workflowRun?.conclusion === "success";
            const forkReviewApproved = !sameRepository &&
              (pullRequest.labels || []).some((label) =>
                label.name === "safe-to-review"
              );

            // One model call per head revision. A check run name and summary
            // are writable by any workflow token holding checks: write,
            // including one in a workflow a pull request branch adds. The
            // check run is therefore only a prefilter. The proof is the
            // verdict artifact, accepted only from a workflow_run of this
            // workflow file on the default branch. GitHub runs workflow_run
            // workflows from the default branch alone, so a pull request
            // branch cannot produce one. A failed run uploads no record, so
            // a flaky review still retries.
            const getRun = async (runId) => {
              const { data } = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              return data;
            };
            const hasTrustedVerdictRecord = async (sha) => {
              const name = `security-review-verdict-${sha}`;
              const artifacts = await github.paginate(
                github.rest.actions.listArtifactsForRepo,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name,
                  per_page: 100,
                },
              );
              const records = artifacts.filter((artifact) =>
                artifact.name === name &&
                !artifact.expired &&
                artifact.workflow_run?.id
              );
              if (records.length === 0) {
                return false;
              }
              const trustedPath = (await getRun(context.runId)).path;
              const defaultBranch = context.payload.repository?.default_branch;
              for (const record of records) {
                const producer = await getRun(record.workflow_run.id);
                if (
                  producer.event === "workflow_run" &&
                  producer.path === trustedPath &&
                  Boolean(defaultBranch) &&
                  producer.head_branch === defaultBranch
                ) {
                  return true;
                }
              }
              return false;
            };
            const checkRuns = await github.paginate(
              github.rest.checks.listForRef,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: headSha,
                check_name: "security-review",
                per_page: 100,
              },
            );
            const hasVerdictCheck = checkRuns.some((run) =>
              run.status === "completed" &&
              /VERDICT: (APPROVE|BLOCK|NEEDS-HUMAN)\b/.test(
                run.output?.summary || ""
              )
            );
            const alreadyReviewed = hasVerdictCheck &&
              await hasTrustedVerdictRecord(headSha);
            core.setOutput("already_reviewed", alreadyReviewed ? "true" : "false");
            core.setOutput(
              "fork_review_approved",
              forkReviewApproved ? "true" : "false",
            );
            core.setOutput(
              "compliance_passed",
              compliancePassed ? "true" : "false",
            );
            core.setOutput(
              "same_repository",
              sameRepository ? "true" : "false",
            );
            core.setOutput("pr_number", String(pullRequest.number));
            core.setOutput("base_sha", pullRequest.base.sha);
            core.setOutput("head_sha", pullRequest.head.sha);
            core.setOutput("head_repo_url", headRepository.clone_url);
            core.setOutput("head_repo_full_name", headRepository.full_name);

  review:
    needs: resolve-pr
    if: >-
      needs.resolve-pr.result == 'success'
      && needs.resolve-pr.outputs.same_repository == 'true'
      && needs.resolve-pr.outputs.already_reviewed != 'true'
    # A called workflow can only narrow these grants. The reusable review job
    # requests each one.
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/security-review.yml
    with:
      audit_ref: ${{ needs.resolve-pr.outputs.audit_ref }}
      model_call_command: "python3 ci/call_model.py"
      pr_comment: true
      fail_on_block: true
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve-pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve-pr.outputs.head_repo_full_name }}
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  fork-review:
    needs: resolve-pr
    if: >-
      needs.resolve-pr.result == 'success'
      && needs.resolve-pr.outputs.same_repository == 'false'
      && needs.resolve-pr.outputs.fork_review_approved == 'true'
      && needs.resolve-pr.outputs.compliance_passed == 'true'
      && needs.resolve-pr.outputs.already_reviewed != 'true'
    permissions:
      checks: write
      contents: read
      pull-requests: write
    uses: ./.github/workflows/security-review.yml
    with:
      audit_ref: ${{ needs.resolve-pr.outputs.audit_ref }}
      model_call_command: "python3 ci/call_model.py"
      pr_comment: true
      fail_on_block: true
      pr_number: ${{ needs.resolve-pr.outputs.pr_number }}
      base_sha: ${{ needs.resolve-pr.outputs.base_sha }}
      head_sha: ${{ needs.resolve-pr.outputs.head_sha }}
      head_repo_url: ${{ needs.resolve-pr.outputs.head_repo_url }}
      head_repo_full_name: ${{ needs.resolve-pr.outputs.head_repo_full_name }}
      fork_review: true
    secrets:
      MODEL_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

  fork-review-skipped:
    needs: resolve-pr
    if: >-
      needs.resolve-pr.result == 'success'
      && needs.resolve-pr.outputs.same_repository == 'false'
      && (needs.resolve-pr.outputs.fork_review_approved != 'true'
      || needs.resolve-pr.outputs.compliance_passed != 'true')
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain skipped review
        run: >-
          echo "Fork review is waiting for the safe-to-review label on the
          pull request, a successful immutable-conflict-check run, and manual
          approval in the fork-review environment."
