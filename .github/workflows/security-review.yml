---
name: security-review

# Reusable workflow that runs the pinned abuzucom/foucault AUDIT.md against a
# pull request diff and publishes the result. Euler's reusable copy keeps the
# adapter scripts in the pinned .foucault checkout because this repository's
# own ci/ holds the euler quality adapter at the paths the upstream reusable
# expects. This file mirrors foucault's security-review.yml at the pinned
# revision. Upgrade: diff this file against the new upstream workflow and port
# each change while keeping the .foucault/ paths.
#
# workflow_run callers resolve the metadata ahead of the call. A direct
# pull_request caller must pass no resolved metadata. Pass only the
# credential the model_call_command needs. Never use inherited secrets: this
# job runs a model over an untrusted pull request diff, and inherited secrets
# hand it every secret the calling repository holds.
#
# Pin audit_ref to the same full commit SHA as the review pin. Record the
# release version in a comment beside the pin.
"on":
  workflow_call:
    inputs:
      audit_ref:
        description: "abuzucom/foucault commit SHA to load AUDIT.md from. Match the caller's review pin."
        required: true
        type: string
      model_call_command:
        description: "Reads $AUDIT_PROMPT_FILE and $CASE_TEXT_FILE. Writes the model response to stdout."
        required: true
        type: string
      pr_comment:
        description: "Post the report as a PR comment."
        required: false
        type: boolean
        default: true
      fail_on_block:
        description: "Fail the job when the response's VERDICT line is BLOCK or NEEDS-HUMAN."
        required: false
        type: boolean
        default: true
      fork_review:
        description: "Run this review through the protected fork-review environment."
        required: false
        type: boolean
        default: false
      pr_number:
        description: "Resolved pull request number for workflow_run callers."
        required: false
        type: string
      base_sha:
        description: "Resolved pull request base SHA for workflow_run callers."
        required: false
        type: string
      head_sha:
        description: "Resolved pull request head SHA for workflow_run callers."
        required: false
        type: string
      head_repo_url:
        description: "Resolved pull request head repository URL for workflow_run callers."
        required: false
        type: string
      head_repo_full_name:
        description: "Resolved pull request head repository name for workflow_run callers."
        required: false
        type: string
    secrets:
      MODEL_API_KEY:
        description: "Provider API key for the selected trusted adapter."
        required: false

jobs:
  review:
    if: inputs.fork_review != true
    runs-on: ubuntu-latest
    concurrency:
      # A direct pull_request caller passes no pr_number. The event number
      # keeps each pull request in its own group for both caller styles.
      group: security-review-pr-${{ inputs.pr_number }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps: &security_review_steps
      - name: Resolve pull request metadata
        id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_AUDIT_REF: ${{ inputs.audit_ref }}
          INPUT_MODEL_CALL_COMMAND: ${{ inputs.model_call_command }}
          INPUT_BASE_SHA: ${{ inputs.base_sha }}
          INPUT_HEAD_SHA: ${{ inputs.head_sha }}
          INPUT_HEAD_REPO_URL: ${{ inputs.head_repo_url }}
          INPUT_HEAD_REPO_FULL_NAME: ${{ inputs.head_repo_full_name }}
        with:
          script: |
            const shaPattern = /^[0-9a-f]{40}$/;
            const auditRefPattern = /^[0-9a-f]{40}$/;
            const repositoryPattern = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
            const inputValues = [
              process.env.INPUT_PR_NUMBER,
              process.env.INPUT_BASE_SHA,
              process.env.INPUT_HEAD_SHA,
              process.env.INPUT_HEAD_REPO_URL,
              process.env.INPUT_HEAD_REPO_FULL_NAME,
            ];

            const emitMetadata = (number, baseSha, headSha, repoUrl, repoName) => {
              if (!/^[1-9][0-9]*$/.test(String(number))) {
                throw new Error("pull request number is invalid");
              }
              if (!shaPattern.test(baseSha) || !shaPattern.test(headSha)) {
                throw new Error("pull request revisions are invalid");
              }
              if (!repositoryPattern.test(repoName)) {
                throw new Error("pull request repository is invalid");
              }
              if (!repoUrl || !repoUrl.startsWith("https://github.com/")) {
                throw new Error("pull request repository URL is invalid");
              }
              core.setOutput("pr_number", String(number));
              core.setOutput("base_sha", baseSha);
              core.setOutput("head_sha", headSha);
              core.setOutput("head_repo_url", repoUrl);
              core.setOutput("head_repo_full_name", repoName);
            };

            try {
              if (!auditRefPattern.test(process.env.INPUT_AUDIT_REF || "")) {
                throw new Error("audit policy revision is invalid");
              }
              if (
                !/^python3 ci\/call_model\.py$/.test(
                  process.env.INPUT_MODEL_CALL_COMMAND || ""
                )
              ) {
                throw new Error("model call command is not the trusted adapter");
              }
              core.setOutput("audit_ref", process.env.INPUT_AUDIT_REF);
              if (inputValues.some((value) => value)) {
                if (inputValues.some((value) => !value)) {
                  throw new Error("resolved pull request metadata is incomplete");
                }
                emitMetadata(
                  process.env.INPUT_PR_NUMBER,
                  process.env.INPUT_BASE_SHA,
                  process.env.INPUT_HEAD_SHA,
                  process.env.INPUT_HEAD_REPO_URL,
                  process.env.INPUT_HEAD_REPO_FULL_NAME,
                );
                return;
              }

              const directPullRequest = context.payload.pull_request;
              if (directPullRequest) {
                emitMetadata(
                  directPullRequest.number,
                  directPullRequest.base?.sha,
                  directPullRequest.head?.sha,
                  directPullRequest.head?.repo?.clone_url,
                  directPullRequest.head?.repo?.full_name,
                );
                return;
              }

              const headSha = context.payload.workflow_run?.head_sha;
              if (!shaPattern.test(headSha || "")) {
                throw new Error("workflow run head SHA is invalid");
              }
              const pullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  commit_sha: headSha,
                  per_page: 100,
                },
              );
              const baseRepository = `${context.repo.owner}/${context.repo.repo}`;
              const candidates = pullRequests.filter((pullRequest) =>
                pullRequest.base?.repo?.full_name?.toLowerCase() ===
                baseRepository.toLowerCase() &&
                pullRequest.head?.sha?.toLowerCase() === headSha.toLowerCase()
              );
              if (candidates.length !== 1) {
                throw new Error(
                  `expected one pull request for workflow run head, found ${candidates.length}`,
                );
              }
              const pullRequest = candidates[0];
              emitMetadata(
                pullRequest.number,
                pullRequest.base?.sha,
                pullRequest.head?.sha,
                pullRequest.head?.repo?.clone_url,
                pullRequest.head?.repo?.full_name,
              );
            } catch (error) {
              core.setFailed(error.message);
            }

      # The review repository carries the worktree the case builder uses.
      # workflow_run pins github.sha to the default branch, so this checkout
      # holds trusted content. The pull request base and head travel as git
      # objects; no API-derived ref is ever checked out.
      - name: Checkout the trusted review repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout AUDIT.md
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: abuzucom/foucault
          ref: ${{ steps.resolve.outputs.audit_ref }}
          path: .foucault
          persist-credentials: false

      - name: Verify AUDIT.md revision
        env:
          EXPECTED_AUDIT_REF: ${{ steps.resolve.outputs.audit_ref }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git -C .foucault rev-parse HEAD)"
          if [ "$checked_out_sha" != "$EXPECTED_AUDIT_REF" ]; then
            echo "error: checked out policy SHA $checked_out_sha does not match expected $EXPECTED_AUDIT_REF" >&2
            exit 1
          fi

      - name: Verify pinned review scripts
        run: |
          set -euo pipefail
          # Later steps run these scripts from the pinned .foucault checkout.
          # Name each absent one here instead of failing later with a less
          # specific error.
          missing=0
          for script in \
            .foucault/ci/build_pr_case.py \
            .foucault/ci/run_model_command.py \
            .foucault/scripts/check_pr_review_response.py; do
            if [ ! -f "$script" ]; then
              echo "error: $script is missing from the pinned .foucault checkout" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Fetch pull request objects
        env:
          PR_HEAD_REPO_URL: ${{ steps.resolve.outputs.head_repo_url }}
          HEAD_REPO_FULL_NAME: ${{ steps.resolve.outputs.head_repo_full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        run: |
          set -euo pipefail
          python3 - "$PR_HEAD_REPO_URL" "$HEAD_REPO_FULL_NAME" "$BASE_REPOSITORY" "$BASE_SHA" "$HEAD_SHA" <<'PY'
          import os
          import re
          import subprocess
          import sys
          from urllib.parse import urlsplit

          (
              repository_url,
              head_repository,
              base_repository,
              base_sha,
              head_sha,
          ) = sys.argv[1:]
          parsed = urlsplit(repository_url)
          if parsed.scheme != "https" or parsed.hostname != "github.com":
              raise SystemExit("PR head repository URL is not an approved GitHub URL")
          if (
              parsed.query
              or parsed.fragment
              or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", head_repository)
              or not re.fullmatch(r"[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+", base_repository)
              or not re.fullmatch(r"[0-9a-f]{40}", base_sha)
              or not re.fullmatch(r"[0-9a-f]{40}", head_sha)
          ):
              raise SystemExit("PR head metadata is invalid")
          # The base repository equals the caller repository, which is also
          # the origin of this checkout. The base arrives as objects from
          # the trusted origin alone.
          subprocess.run(
              ["git", "fetch", "--no-tags", "origin", base_sha],
              check=True,
          )
          fetch_source = (
              "origin"
              if head_repository.casefold() == base_repository.casefold()
              else repository_url
          )
          # Full history lets the case builder diff from the merge base. The
          # base checkout already holds every base commit, so only commits
          # missing from it transfer.
          subprocess.run(
              ["git", "fetch", "--no-tags", fetch_source, head_sha],
              check=True,
          )
          PY

      - name: Build provenance-labeled case text
        id: case
        env:
          EVENT_PATH: ${{ github.event_path }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          PR_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          AUDIT_PROMPT_FILE: .foucault/AUDIT.md
        run: |
          set -euo pipefail
          # Exit code 3 means the diff exceeds review capacity. The capacity
          # report step then records NEEDS-HUMAN instead of no verdict.
          status=0
          python3 .foucault/ci/build_pr_case.py || status=$?
          if [ "$status" -eq 3 ]; then
            echo "oversized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$status"

      - name: Run model call
        id: model
        if: ${{ steps.case.outputs.oversized != 'true' }}
        env:
          AUDIT_PROMPT_FILE: .foucault/AUDIT.md
          CASE_TEXT_FILE: case_text.txt
          # Resolved against the .foucault checkout by run_model_command.py.
          MODEL_CALL_COMMAND: ${{ inputs.model_call_command }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
        run: |
          set -euo pipefail
          # Exit code 3 means the input exceeds every configured model
          # budget. The capacity report step then records NEEDS-HUMAN.
          status=0
          python3 .foucault/ci/run_model_command.py "$MODEL_CALL_COMMAND" > response.txt || status=$?
          if [ "$status" -eq 3 ]; then
            echo "oversized=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          if ! python3 .foucault/scripts/check_pr_review_response.py response.txt > /dev/null; then
            echo "first response failed validation; one retry" >&2
            python3 .foucault/ci/run_model_command.py "$MODEL_CALL_COMMAND" > response.txt
          fi

      # Fixed text only. The report quotes nothing from the pull request. An
      # author cannot shape the verdict this step records.
      - name: Write capacity review report
        if: ${{ steps.case.outputs.oversized == 'true' || steps.model.outputs.oversized == 'true' }}
        run: |
          set -euo pipefail
          cat > response.txt <<'REPORT'
          Security review: not performed

          The pull request diff exceeds the input budget of every configured
          review model. The automated review covered no files. A human
          reviewer must assess the complete diff before merge.

          VERDICT: NEEDS-HUMAN - diff exceeds automated review capacity
          VERDICT_JSON: {"mode": "PR", "verdict": "NEEDS-HUMAN", "findings": []}
          REPORT

      - name: Validate report structure
        id: validate
        run: |
          set -euo pipefail
          if ! validation_error="$(
            python3 .foucault/scripts/check_pr_review_response.py response.txt 2>&1 > /dev/null
          )"; then
            echo "final response failed structural validation:" >&2
            printf '%s\n' "$validation_error" >&2
            echo "the model response is attached as the invalid-review-response artifact" >&2
            exit 1
          fi

      # The model response is untrusted text. A log line starting with :: is a
      # GitHub Actions workflow command, so echoing the response to stderr lets
      # a prompt-injected response set outputs, mask values, or stop command
      # processing. An artifact keeps the response out of the log stream while
      # leaving it available for diagnosis.
      - name: Upload the invalid model response
        if: ${{ failure() && steps.validate.conclusion == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: invalid-review-response
          path: response.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Parse verdict
        id: verdict
        env:
          FAIL_ON_BLOCK: ${{ inputs.fail_on_block }}
        run: |
          set -euo pipefail
          # This workflow builds its case text from a pull request diff, so it
          # always runs PR mode, whose section 6 token is VERDICT. Accepting a
          # RISK line would let a report answering in another mode satisfy a
          # merge gate that mode never addressed. File and Wholesale modes
          # make no merge claim at all.
          #
          # The report also quotes the pull request title, body, and diff, all
          # of which an author controls. A planted VERDICT: APPROVE line
          # reaching column zero in a quoted block would decide the gate if
          # the first match won. Section 6 puts the authoritative verdict
          # last, so read the final match.
          line="$(grep -E '^VERDICT:' response.txt | tail -1 || true)"
          if [ -z "$line" ]; then
            echo "No VERDICT: line found in response. PR mode requires one." >&2
            exit 1
          fi
          delimiter="verdict_line_$(date +%s%N)"
          {
            echo "line<<$delimiter"
            echo "$line"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          # Read the token alone. Searching the whole line matches the reason
          # too, which both fails closed on
          # 'VERDICT: APPROVE - resolved earlier BLOCK findings' and fails
          # open on an unrecognized token, because 'VERDICT: REJECT' matches
          # neither alternative and would merge.
          rest="${line#VERDICT:}"
          # read splits on whitespace without pathname expansion, so a
          # token such as * stays literal and fails as unrecognized.
          read -r verdict_token _ <<< "$rest"
          case "$verdict_token" in
            APPROVE)
              echo "blocked=false" >> "$GITHUB_OUTPUT"
              ;;
            # NEEDS-HUMAN is the section 1.8 escalation for a review that
            # cannot determine safety. Passing it green merges the change the
            # review declined to clear, so it gates as BLOCK does.
            BLOCK|NEEDS-HUMAN)
              if [ "$FAIL_ON_BLOCK" = "true" ]; then
                echo "blocked=true" >> "$GITHUB_OUTPUT"
              else
                echo "blocked=false" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              # Section 6 admits no other token. Treat one as malformed
              # output rather than as a verdict, the same way a missing
              # VERDICT: line already fails. fail_on_block governs which
              # verdicts block, not whether a non-verdict counts as a pass.
              echo "Unrecognized verdict token '$verdict_token'." \
                "Section 6 allows APPROVE, BLOCK, or NEEDS-HUMAN." >&2
              exit 1
              ;;
          esac

      - name: Post PR comment
        if: ${{ inputs.pr_comment }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.readFileSync('response.txt', 'utf8');
            // The report is model output shaped by an attacker-controlled diff.
            // Fence it so markdown cannot render images, links or mentions.
            // The fence outruns the longest backtick run in the report, so a
            // fenced block inside it cannot close the wrapper early.
            const runs = raw.match(/`+/g) || [];
            const longest = runs.reduce((n, s) => Math.max(n, s.length), 0);
            const fence = '`'.repeat(Math.max(3, longest + 1));
            const metadata = [
              "Security review metadata",
              `- Head: \`${process.env.HEAD_SHA}\``,
              `- Base: \`${process.env.BASE_SHA}\``,
              `- Workflow run: ${process.env.RUN_URL}`,
              "",
            ].join("\n");
            const body = `${metadata}${fence}\n${raw}\n${fence}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });

      # The caller skips a head that already has a review record. A check
      # run name and summary are writable by any workflow token holding
      # checks: write, including one in a workflow a pull request branch
      # adds. An artifact belongs to the run that uploaded it, so the caller
      # trusts only this record and verifies the run that produced it.
      - name: Write verdict record
        if: ${{ always() && steps.verdict.outputs.line != '' }}
        env:
          VERDICT_LINE: ${{ steps.verdict.outputs.line }}
        run: printf '%s\n' "$VERDICT_LINE" > verdict.txt

      - name: Upload verdict record
        if: ${{ always() && steps.verdict.outputs.line != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: security-review-verdict-${{ steps.resolve.outputs.head_sha }}
          path: verdict.txt
          if-no-files-found: error

      - name: Fail on a blocking verdict
        if: ${{ steps.verdict.outputs.blocked == 'true' }}
        env:
          VERDICT_LINE: ${{ steps.verdict.outputs.line }}
        run: |
          echo "$VERDICT_LINE" >&2
          exit 1

      - name: Publish check run
        if: ${{ always() }}
        timeout-minutes: 1
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          JOB_STATUS: ${{ job.status }}
          VERDICT_LINE: ${{ steps.verdict.outputs.line }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            // The review executes on the default branch under workflow_run.
            // Without a check run on the head revision the result never
            // appears in the pull request checks box.
            const conclusion = process.env.JOB_STATUS === "success"
              ? "success"
              : "failure";
            // The verdict line is model output shaped by the pull request
            // under review. Strip characters that could break the inline
            // code span, and bound the length.
            const sanitize = (value) =>
              value.replace(/[`\\\x00-\x1f\x7f]/g, "").slice(0, 200);
            const verdictLine = sanitize(process.env.VERDICT_LINE || "")
              || "review failed before a verdict was produced";
            const shortHeadSha = process.env.HEAD_SHA.slice(0, 12);
            const request = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "security-review",
              head_sha: process.env.HEAD_SHA,
              status: "completed",
              conclusion,
              details_url: process.env.RUN_URL,
              output: {
                title: `security-review: ${conclusion}`,
                summary: `Head ${shortHeadSha}: model review result: \`${verdictLine}\``,
              },
            };
            let lastError = null;
            for (let attempt = 0; attempt < 2; attempt++) {
              try {
                await github.rest.checks.create(request);
                lastError = null;
                break;
              } catch (error) {
                lastError = error;
              }
            }
            if (lastError) {
              if (conclusion === "success") {
                // A publication flake must not mask a passed review. The
                // warning stays in the run log and the comment carries the
                // verdict.
                core.warning(
                  `check run publication failed: ${lastError.message}`
                );
              } else {
                throw lastError;
              }
            }

  fork-review:
    if: inputs.fork_review == true
    runs-on: ubuntu-latest
    environment: fork-review
    concurrency:
      group: security-review-pr-${{ inputs.pr_number }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      checks: write
      contents: read
      pull-requests: write
    steps: *security_review_steps
