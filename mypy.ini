[mypy]
files = scripts, ci, eval/run_eval.py
# The compliance checker runs on the Linux CI runner and uses one POSIX-only
# attribute. Local lint checks the same Linux view for parity with CI.
platform = linux

# The vendored foucault checker modules load PyYAML, which ships no stubs
# with this toolchain.
[mypy-yaml]
ignore_missing_imports = True

[mypy-yaml.*]
ignore_missing_imports = True

# trusted_gh.py imports the agents hooks gate at runtime and degrades to a
# clear operator error when the hooks directory is absent.
[mypy-_gate_core]
ignore_missing_imports = True
